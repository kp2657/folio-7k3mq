<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Long-term proposal</title>
  <style>
    :root {
      --ink: #111;
      --muted: #666;
      --line: #e4e4e4;
      --bg: #fff;
      --soft: #f6f6f6;
      --unknown: #8a5a12;
      --unknown-bg: #f6e7c8;
      --question: #1d4e89;
      --question-bg: #d9e6f5;
      --notstarted: #444;
      --notstarted-bg: #ececec;
      --progress: #0f6e56;
      --progress-bg: #d5efe6;
      --blocked: #9d1c1c;
      --blocked-bg: #f8d4d4;
      --done: #1e6b32;
      --done-bg: #d7efdc;
      --label: 22rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.35;
    }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2 { font-weight: 700; letter-spacing: 0; margin: 0; }
    p { margin: 0; }
    .wrap { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }
    header.top { padding: 1.4rem 0 0.6rem; }
    .banner { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    h1 { font-size: 1.6rem; margin: 0.3rem 0; }
    .lede { color: var(--muted); max-width: 46rem; }
    .howto { margin-top: 0.7rem; color: var(--muted); font-size: 13px; }

    .people, .statuses { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; margin: 0.8rem 0 0.4rem; }
    .people { margin-top: 1rem; }
    .kicker { color: var(--muted); font-size: 12px; margin-right: 0.25rem; }
    .chip, select {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      padding: 0.22rem 0.5rem;
      font-size: 13px;
    }
    .chip[aria-pressed="true"], .chip.pinned { background: var(--ink); color: #fff; border-color: var(--ink); }
    .swatch { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; margin-right: 0.3rem; }

    section { margin: 0.6rem 0 1.4rem; }
    .gantt-scroll { overflow-x: auto; border-top: 1px solid var(--line); }
    .gantt { min-width: 860px; }
    .scale, .grow { display: grid; grid-template-columns: var(--label) 1fr; }
    .scale { color: var(--muted); font-size: 12px; }
    .scale-track, .track { position: relative; }
    .scale-track { height: 2.6rem; }
    .month, .mark-label { position: absolute; top: 0.15rem; white-space: nowrap; }
    .mark-label { top: 1.25rem; font-size: 11px; }
    .mark-label.proposed { color: #8a5a12; }
    .mark-label.deadline { color: #9d1c1c; font-weight: 700; }
    .mark-label.today { color: var(--ink); font-weight: 700; }

    .grow { border-bottom: 1px solid var(--line); min-height: 3.35rem; }
    .grow.group { min-height: 2.3rem; background: #f3f3f3; }
    .grow.child .task-label { padding-left: 0.85rem; }
    .grow.d1 .task-label { margin-left: 1.15rem; padding-left: 0.7rem; box-shadow: inset 3px 0 0 #111; }
    .grow.gap { margin-top: 0.7rem; }
    .grow.dim { opacity: 0.22; }
    .grow.hot { background: var(--soft); }
    .grow.hot .task-label { box-shadow: inset 3px 0 0 var(--ink); }
    .task-label { padding: 0.45rem 0.8rem 0.45rem 0.7rem; display: flex; flex-direction: column; justify-content: center; gap: 0.12rem; }
    .grow.group .item { font-size: 13px; letter-spacing: 0.02em; text-transform: uppercase; }
    .item {
      background: none; border: 0; padding: 0; text-align: left; font-weight: 700;
    }
    .item:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 12px; }
    .rel { color: var(--ink); font-size: 12px; font-weight: 700; }
    .track { min-height: 3.35rem; }
    .gridline, .marker, .today-line { position: absolute; top: 0; bottom: 0; width: 1px; pointer-events: none; }
    .gridline { background: #f0f0f0; }
    .marker.proposed { background: #8a5a12; }
    .marker.deadline { background: #9d1c1c; width: 2px; }
    .today-line { background: var(--ink); width: 2px; z-index: 2; }
    .bar {
      position: absolute; top: 0.55rem; height: 2.15rem; border: 0; border-radius: 3px;
      padding: 0 0.5rem; text-align: left; font-size: 12px; font-weight: 700;
      z-index: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .bar.open {
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 7px, rgba(255,255,255,0.55) 7px, rgba(255,255,255,0.55) 12px);
    }
    .bar:focus-visible, .item:focus-visible, .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .status-Unassigned { background-color: var(--unknown-bg); color: var(--unknown); }
    .status-Question { background-color: var(--question-bg); color: var(--question); }
    .status-Not-started { background-color: var(--notstarted-bg); color: var(--notstarted); }
    .status-In-progress { background-color: var(--progress-bg); color: var(--progress); }
    .status-Blocked { background-color: var(--blocked-bg); color: var(--blocked); }
    .status-Done { background-color: var(--done-bg); color: var(--done); }
    .swatch.status-Unassigned { background: var(--unknown); }
    .swatch.status-Question { background: var(--question); }
    .swatch.status-Not-started { background: var(--notstarted); }
    .swatch.status-In-progress { background: var(--progress); }
    .swatch.status-Blocked { background: var(--blocked); }
    .swatch.status-Done { background: var(--done); }

    footer { color: var(--muted); font-size: 13px; padding: 0.4rem 0 2rem; }

    dialog { border: 1px solid #ccc; border-radius: 6px; padding: 0; width: min(36rem, calc(100% - 2rem)); }
    dialog::backdrop { background: rgba(0,0,0,0.35); }
    .dialog-body { padding: 1rem 1.1rem 1.1rem; }
    dialog h2 { font-size: 1.15rem; margin-bottom: 0.3rem; }
    .meta-line { color: var(--muted); margin-bottom: 0.7rem; }
    dl { display: grid; grid-template-columns: 7rem 1fr; gap: 0.3rem 0.7rem; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .close { margin-top: 0.9rem; background: var(--ink); color: #fff; border: 0; border-radius: 4px; padding: 0.35rem 0.7rem; }
    .empty { color: var(--muted); padding: 0.8rem 0; }

    @media (max-width: 800px) {
      :root { --label: 13rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="banner">Unpublished. This collaboration only. Do not put images or quantification on this page.</div>
      <h1>Long-term proposal</h1>
      <p class="lede" id="lede"></p>
      <p class="howto">An indented row depends on the row above it. A striped bar has no date. Hover a name to see only that person's rows.</p>
      <div class="people" id="people"></div>
      <div class="statuses" id="statuses"></div>
    </header>
    <section>
      <div class="gantt-scroll">
        <div class="gantt" id="gantt"></div>
      </div>
    </section>
    <footer>Recorded 1 Nov 2026. To change a row, edit tasks.json and push.</footer>
  </div>
  <dialog id="detail">
    <div class="dialog-body">
      <h2 id="d-title"></h2>
      <p class="meta-line" id="d-meta"></p>
      <dl id="d-list"></dl>
      <button class="close" type="button" id="d-close">Close</button>
    </div>
  </dialog>
  <script>
    const STATUSES = ["Unassigned", "Question", "Not started", "In progress", "Blocked", "Done"];
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let data = null;
    let ordered = [];
    let statusFilter = "All";
    let pinnedOwner = null;
    let hoverOwner = null;
    let hoverId = null;

    function parseDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }
    function fmt(date) {
      return date.getDate() + " " + MONTHS[date.getMonth()] + " " + date.getFullYear();
    }
    function daysBetween(a, b) {
      return Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
    }
    function statusClass(status) {
      return "status-" + status.replace(/\s+/g, "-");
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }
    function byId() {
      const map = {};
      data.tasks.forEach((task) => { map[task.id] = task; });
      return map;
    }
    function groupedTasks() {
      const map = byId();
      function rows(specs) {
        return specs.map((spec) => {
          const task = map[spec.id];
          if (!task || !taskShown(task)) return null;
          return { task: task, depth: spec.depth || 0 };
        }).filter(Boolean);
      }
      return [
        {
          id: "proposal",
          title: "Long-term proposal",
          blocks: [
            { rows: rows([
              { id: "data-package", depth: 0 },
              { id: "data-analysis", depth: 1 },
              { id: "meet-decision", depth: 1 }
            ]) },
            { rows: rows([
              { id: "meet-sandra", depth: 0 },
              { id: "data-backup", depth: 1 }
            ]) },
            { rows: rows([
              { id: "ltp-esrf", depth: 0 },
              { id: "ltp-resource", depth: 1 },
              { id: "ltp-coi", depth: 0 },
              { id: "ltp-collect", depth: 1 },
              { id: "ltp-aims", depth: 0 },
              { id: "ltp-drafters", depth: 0 },
              { id: "ltp-draft", depth: 0 },
              { id: "ltp-submit", depth: 1 }
            ]) }
          ]
        },
        {
          id: "safety",
          title: "Safety",
          blocks: [
            { rows: rows([
              { id: "safe-sop", depth: 0 },
              { id: "safe-forms", depth: 0 }
            ]) }
          ]
        }
      ];
    }
    function taskShown(task) {
      return statusFilter === "All" || task.status === statusFilter;
    }
    function namesIn(owner) {
      return owner.split(" and ").map((part) => part.trim());
    }
    function owns(owner, person) {
      return namesIn(owner).indexOf(person) !== -1 || owner === person;
    }
    function activeOwner() {
      return hoverOwner || pinnedOwner;
    }
    function related(id) {
      const map = byId();
      const before = new Set();
      const after = new Set();
      function up(tid) {
        (map[tid].waitingOn || []).forEach((pid) => {
          if (map[pid] && !before.has(pid)) { before.add(pid); up(pid); }
        });
      }
      function down(tid) {
        data.tasks.forEach((task) => {
          if (task.waitingOn.indexOf(tid) !== -1 && !after.has(task.id)) {
            after.add(task.id);
            down(task.id);
          }
        });
      }
      up(id);
      down(id);
      return { before: before, after: after };
    }
    function afterText(task, map) {
      if (!task.waitingOn.length) return "";
      return "After " + task.waitingOn.map((id) => map[id] ? map[id].title : id).join(", ");
    }
    function blocksText(task) {
      const titles = data.tasks.filter((item) => item.waitingOn.indexOf(task.id) !== -1).map((item) => item.title);
      if (!titles.length) return "";
      return "Then " + titles.join(", ");
    }
    function geometry(task, map, today) {
      const windowStart = parseDate(data.window.start);
      const windowEnd = parseDate(data.window.end);
      const span = windowEnd - windowStart;
      const pos = (date) => ((date - windowStart) / span) * 100;
      if (!task.due || parseDate(task.due) > windowEnd) {
        return { open: true, left: 0, width: 100, outside: task.due ? fmt(parseDate(task.due)) : "" };
      }
      const due = parseDate(task.due);
      let start = today > windowStart ? today : windowStart;
      task.waitingOn.forEach((id) => {
        const dep = map[id];
        if (!dep || !dep.due) return;
        const depDue = parseDate(dep.due);
        if (depDue <= windowEnd && depDue > start) start = depDue;
      });
      if (start > due) start = due;
      return { open: false, left: pos(start), width: Math.max(pos(due) - pos(start), 2), outside: "" };
    }

    function openDetail(task) {
      const map = byId();
      document.getElementById("d-title").textContent = task.title;
      document.getElementById("d-meta").textContent = task.workstream + " · " + task.owner + " · " + task.status;
      const list = document.getElementById("d-list");
      clear(list);
      const rows = [
        ["Waiting on", task.waitingOn.length ? task.waitingOn.map((id) => map[id] ? map[id].title : id).join("; ") : "Nothing"],
        ["Blocks", blocksText(task).replace(/^Then /, "") || "Nothing"],
        ["Needed by", task.due ? fmt(parseDate(task.due)) : "No date"],
        ["Note", task.note],
        ["Source", task.source]
      ];
      rows.forEach(([term, value]) => {
        list.appendChild(el("dt", "", term));
        list.appendChild(el("dd", "", value));
      });
      document.getElementById("detail").showModal();
    }

    function paint() {
      const owner = activeOwner();
      const chain = hoverId ? related(hoverId) : null;
      const hotGroups = new Set();
      document.querySelectorAll(".grow.child").forEach((row) => {
        const id = row.dataset.id;
        const rowOwner = row.dataset.owner;
        let hot = false;
        let on = false;
        if (chain) {
          on = true;
          hot = id === hoverId || chain.before.has(id) || chain.after.has(id);
        } else if (owner) {
          on = true;
          hot = owns(rowOwner, owner);
        }
        row.classList.toggle("dim", on && !hot);
        row.classList.toggle("hot", on && hot);
        if (on && hot && row.dataset.group) hotGroups.add(row.dataset.group);
        const tag = row.querySelector(".rel");
        if (tag) {
          if (!chain || !hot || id === hoverId) tag.textContent = "";
          else tag.textContent = chain.before.has(id) ? "Before this" : "After this";
        }
      });
      document.querySelectorAll(".grow.group").forEach((row) => {
        const owner = activeOwner();
        const on = Boolean(hoverId || owner);
        const hot = hotGroups.has(row.dataset.group);
        row.classList.toggle("dim", on && !hot);
        row.classList.toggle("hot", on && hot);
      });
      document.querySelectorAll("#people .chip").forEach((chip) => {
        const name = chip.dataset.name;
        const pressed = name === "Everyone" ? !pinnedOwner && !hoverOwner : name === owner;
        chip.setAttribute("aria-pressed", pressed ? "true" : "false");
        chip.classList.toggle("pinned", name !== "Everyone" && name === pinnedOwner);
      });
    }

    function renderPeople() {
      const bar = document.getElementById("people");
      clear(bar);
      bar.appendChild(el("span", "kicker", "People"));
      const names = [];
      data.people.forEach((person) => { if (names.indexOf(person.name) === -1) names.push(person.name); });
      ["Unassigned"].forEach((name) => { if (names.indexOf(name) === -1) names.push(name); });
      const everyone = el("button", "chip", "Everyone");
      everyone.type = "button";
      everyone.dataset.name = "Everyone";
      everyone.addEventListener("click", () => { pinnedOwner = null; hoverOwner = null; paint(); });
      bar.appendChild(everyone);
      names.forEach((name) => {
        const chip = el("button", "chip", name);
        chip.type = "button";
        chip.dataset.name = name;
        chip.addEventListener("mouseenter", () => { hoverOwner = name; paint(); });
        chip.addEventListener("mouseleave", () => { hoverOwner = null; paint(); });
        chip.addEventListener("click", () => {
          pinnedOwner = pinnedOwner === name ? null : name;
          paint();
        });
        bar.appendChild(chip);
      });
    }

    function renderStatuses() {
      const bar = document.getElementById("statuses");
      clear(bar);
      bar.appendChild(el("span", "kicker", "Status"));
      ["All"].concat(STATUSES).forEach((status) => {
        const chip = el("button", "chip");
        chip.type = "button";
        chip.setAttribute("aria-pressed", statusFilter === status ? "true" : "false");
        if (status !== "All") chip.appendChild(el("span", "swatch " + statusClass(status)));
        chip.appendChild(document.createTextNode(status));
        chip.addEventListener("click", () => { statusFilter = status; renderChart(); });
        bar.appendChild(chip);
      });
    }

    function renderChart() {
      const root = document.getElementById("gantt");
      clear(root);
      const map = byId();
      const today = startOfDay(new Date());
      const windowStart = parseDate(data.window.start);
      const windowEnd = parseDate(data.window.end);
      const span = windowEnd - windowStart;
      const pos = (date) => ((date - windowStart) / span) * 100;
      const groups = groupedTasks().map((group) => ({
        id: group.id,
        title: group.title,
        blocks: group.blocks.filter((block) => block.rows.length)
      })).filter((group) => group.blocks.length);

      const scale = el("div", "scale");
      scale.appendChild(el("div"));
      const scaleTrack = el("div", "scale-track");
      [windowStart, new Date(2026, 11, 1), new Date(2027, 0, 1)].forEach((date) => {
        const month = el("span", "month", MONTHS[date.getMonth()] + " " + date.getFullYear());
        month.style.left = pos(date) + "%";
        scaleTrack.appendChild(month);
      });
      data.markers.forEach((marker) => {
        const label = el("span", "mark-label " + marker.kind, marker.label);
        const at = pos(parseDate(marker.date));
        label.style.left = at + "%";
        if (at > 82) label.style.transform = "translateX(-100%)";
        scaleTrack.appendChild(label);
      });
      if (today >= windowStart && today <= windowEnd) {
        const label = el("span", "mark-label today", "Today");
        label.style.left = pos(today) + "%";
        scaleTrack.appendChild(label);
      }
      scale.appendChild(scaleTrack);
      root.appendChild(scale);

      if (!groups.length) {
        root.appendChild(el("p", "empty", "Nothing matches this status."));
        return;
      }

      groups.forEach((group) => {
        const head = el("div", "grow group");
        head.dataset.group = group.id;
        const headLabel = el("div", "task-label");
        headLabel.appendChild(el("div", "item", group.title));
        head.appendChild(headLabel);
        head.appendChild(el("div", "track"));
        root.appendChild(head);

        group.blocks.forEach((block, blockIndex) => {
          block.rows.forEach((entry, rowIndex) => {
        const task = entry.task;
        const row = el("div", "grow child d" + entry.depth + (blockIndex > 0 && rowIndex === 0 ? " gap" : ""));
        row.dataset.id = task.id;
        row.dataset.owner = task.owner;
        row.dataset.group = group.id;
        const label = el("div", "task-label");
        const name = el("button", "item", task.title);
        name.type = "button";
        name.addEventListener("click", () => openDetail(task));
        label.appendChild(name);
        label.appendChild(el("div", "rel", ""));
        row.appendChild(label);

        const track = el("div", "track");
        const totalDays = daysBetween(windowStart, windowEnd);
        for (let week = 7; week < totalDays; week += 7) {
          const line = el("span", "gridline");
          line.style.left = pos(new Date(windowStart.getFullYear(), windowStart.getMonth(), windowStart.getDate() + week)) + "%";
          track.appendChild(line);
        }
        data.markers.forEach((marker) => {
          const line = el("span", "marker " + marker.kind);
          line.style.left = pos(parseDate(marker.date)) + "%";
          track.appendChild(line);
        });
        if (today >= windowStart && today <= windowEnd) {
          const line = el("span", "today-line");
          line.style.left = pos(today) + "%";
          track.appendChild(line);
        }
        const box = geometry(task, map, today);
        const barText = task.owner + (box.open ? (box.outside ? " · " + box.outside : " · No date") : "");
        const bar = el("button", "bar " + statusClass(task.status) + (box.open ? " open" : ""), barText);
        bar.type = "button";
        bar.style.left = box.left + "%";
        bar.style.width = box.width + "%";
        bar.addEventListener("click", () => openDetail(task));
        track.appendChild(bar);
        row.appendChild(track);

        row.addEventListener("mouseenter", () => { hoverId = task.id; paint(); });
        row.addEventListener("mouseleave", () => { hoverId = null; paint(); });
        root.appendChild(row);
          });
        });
      });
      paint();
    }

    document.getElementById("d-close").addEventListener("click", () => document.getElementById("detail").close());
    document.getElementById("detail").addEventListener("click", (event) => {
      if (event.target.id === "detail") event.target.close();
    });

    fetch("tasks.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("tasks.json did not load");
        return response.json();
      })
      .then((json) => {
        data = json;
        const deadline = data.markers.find((marker) => marker.kind === "deadline");
        const days = daysBetween(startOfDay(new Date()), parseDate(deadline.date));
        document.getElementById("lede").textContent = days + " days to " + deadline.label + ", 5pm CET. The standing date is 15 January, and in 2027 that is a Friday, so filing moves to Monday.";
        renderPeople();
        renderStatuses();
        renderChart();
      })
      .catch(() => {
        document.querySelector("header.top").appendChild(el("p", "empty", "The task file did not load."));
      });
  </script>
</body>
</html>
